<style>
/* Layout: one centred column. Auth and onboarding are single panels; practice is a filter block over a paged list of question cards */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --fg: #14213D; --muted: #5B677A; --line: #DDE3EC;
  --accent: #0A5C8F; --accent-fg: #FFFFFF; --chip: #E8EEF5;
  --good: #1B7F4B; --good-bg: #E3F4EA; --bad: #B3261E; --bad-bg: #FBE7E5;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1520; --surface: #162030; --fg: #E8EEF7; --muted: #9AA8BC; --line: #263447;
    --accent: #5DB3E8; --accent-fg: #0E1520; --chip: #1E2B3E;
    --good: #5CCB8B; --good-bg: #12301F; --bad: #F28B82; --bad-bg: #3A1816; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1520; --surface: #162030; --fg: #E8EEF7; --muted: #9AA8BC; --line: #263447;
  --accent: #5DB3E8; --accent-fg: #0E1520; --chip: #1E2B3E;
  --good: #5CCB8B; --good-bg: #12301F; --bad: #F28B82; --bad-bg: #3A1816; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; letter-spacing: -0.02em; margin: 0; }
.brand span { color: var(--accent); }
h2 { font-family: var(--font-display); font-size: 1.4rem; line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
input[type="text"], input[type="password"], input[type="search"], select {
  width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { color: var(--accent); background: transparent; border: 1px solid var(--accent); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.sm { padding: 7px 14px; font-size: 0.875rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tabs { display: flex; gap: 6px; background: var(--chip); border-radius: 12px; padding: 4px; }
.tab { flex: 1; font: inherit; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-radius: 9px; padding: 9px 12px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.err { color: var(--bad); font-size: 0.875rem; min-height: 1.3em; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-width: 0;
}
.choice .box { flex: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; font-size: 0.8rem; line-height: 1; color: transparent; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); }
.choice[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }
.controls { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 0.875rem; font-weight: 500; color: var(--fg); background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.hello { display: flex; flex-direction: column; gap: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.875rem; color: var(--muted); }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.875rem; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.8125rem; color: var(--muted); }
.tag { font-weight: 600; color: var(--accent); }
.q { font-family: var(--font-display); font-weight: 500; font-size: 1.125rem; line-height: 1.4; margin: 0; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: baseline; text-align: left; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; min-width: 0; }
.opt b { font-family: var(--font-display); color: var(--muted); flex: none; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt:disabled { cursor: default; color: var(--fg); }
.result { font-size: 0.875rem; font-weight: 600; }
.result.ok { color: var(--good); } .result.no { color: var(--bad); }
.explain { border-top: 1px solid var(--line); padding-top: 12px; font-size: 0.9375rem; }
.explain strong { color: var(--accent); }
.more { align-self: center; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.scroll { overflow-x: auto; }
footer { color: var(--muted); font-size: 0.8125rem; border-top: 1px solid var(--line); padding-top: 16px; }
@media (prefers-reduced-motion: no-preference) { .opt, .chip, .choice, .btn, .tab { transition: background 0.15s, border-color 0.15s, opacity 0.15s; } }
</style>
</head>

  var s = ui.mode === "signup";
  return '<div class="panel"><div class="tabs"><button class="tab" data-act="mode" data-v="signup" aria-pressed="' + s + '">Sign up</button><button class="tab" data-act="mode" data-v="login" aria-pressed="' + !s + '">Log in</button></div>' +
    '<div class="hello"><h2>' + (s ? "Create your account" : "Welcome back") + '</h2><p class="muted">' + (s ? "Practise past-question style drills, track your score and pick up where you stopped." : "Log in to continue practising.") + '</p></div>' +
    '<form id="authForm" class="panel" style="border:0;padding:0" autocomplete="off">' +
    (s ? '<div class="field"><label for="f_name">Full name</label><input type="text" id="f_name" autocomplete="name" maxlength="60"></div>' : "") +
    '<div class="field"><label for="f_user">Username</label><input type="text" id="f_user" autocapitalize="none" autocomplete="username" maxlength="20" placeholder="letters, numbers, . or _"></div>' +
    '<div class="field"><label for="f_pw">Password</label><input type="password" id="f_pw" autocomplete="' + (s ? "new-password" : "current-password") + '" placeholder="at least 6 characters"></div>' +
    (s ? '<div class="field"><label for="f_pw2">Confirm password</label><input type="password" id="f_pw2" autocomplete="new-password"></div>' : "") +
    '<div class="err" id="authErr" role="alert"></div>' +
    '<button class="btn" type="submit">' + (s ? "Create account" : "Log in") + '</button></form>' +
    '<p class="muted small">Accounts are saved on this device only. If you use another phone or computer, you will need to sign up again there. A forgotten password cannot be recovered.' + (memOnly ? " Saving is blocked in this browser, so your account will be lost when you close the page." : "") + '</p></div>';
}

async function submitAuth() {
  var err = $("authErr"), s = ui.mode === "signup";
  var un = $("f_user").value.trim().toLowerCase(), pw = $("f_pw").value;
  if (!/^[a-z0-9_.]{3,20}$/.test(un)) { err.textContent = "Username must be 3 to 20 characters: letters, numbers, dot or underscore."; return; }
  if (s) {
    var nm = $("f_name").value.trim().replace(/\s+/g, " ");
    if (nm.length < 2) { err.textContent = "Enter your full name."; return; }
    if (pw.length < 6) { err.textContent = "Password must be at least 6 characters."; return; }
    if (pw !== $("f_pw2").value) { err.textContent = "The two passwords do not match."; return; }
    if (db.users[un]) { err.textContent = "That username is taken on this device. Pick another or log in."; return; }
    var salt = rid();
    db.users[un] = { name: nm, username: un, salt: salt, hash: await hashPw(salt, pw), prep: [], subjects: [], progress: {}, created: Date.now() };
    db.current = un; saveDb(); ui.view = "onboard"; ui.ob = null; route();
  } else {
    var u = db.users[un];
    if (!u || (await hashPw(u.salt, pw)) !== u.hash) { err.textContent = "Wrong username or password."; return; }
    db.current = un; saveDb(); ui.view = (u.subjects && u.subjects.length) ? "app" : "onboard"; ui.ob = null; ui.subject = "mine"; ui.topic = "All"; ui.limit = PAGE; route();
  }
}

/* ---------- onboarding ---------- */
function onboardHtml() {
  var ob = ui.ob, u = me();
  var dots = '<div class="steps"><i class="on"></i><i class="' + (ob.step === 2 ? "on" : "") + '"></i></div>';
  if (ob.step === 1) {
    return '<div class="panel">' + dots + '<div class="hello"><p class="muted small">' + (ob.editing ? "Update your plan" : "Welcome, " + esc(u.name.split(" ")[0])) + '</p><h2>What are you preparing for?</h2><p class="muted">Pick all that apply.</p></div>' +
      '<div class="choices">' + PREPS.map(function (p) { return choiceHtml("prep", p, ob.prep.indexOf(p) > -1); }).join("") + '</div>' +
      '<div class="row">' + (ob.editing ? '<button class="btn ghost" data-act="cancelOb">Cancel</button>' : "") + '<button class="btn" data-act="obNext"' + (ob.prep.length ? "" : " disabled") + '>Continue</button></div></div>';
  }
  return '<div class="panel">' + dots + '<div class="hello"><h2>Which subjects do you want to practise?</h2><p class="muted">Choose the subjects you are writing. You can change them later.</p></div>' +
    '<div class="choices">' + SUBJECTS.map(function (p) { return choiceHtml("subj", p, ob.subjects.indexOf(p) > -1); }).join("") + '</div>' +
    '<div class="row"><button class="btn ghost" data-act="obBack">Back</button><button class="btn" data-act="obDone"' + (ob.subjects.length ? "" : " disabled") + '>' + (ob.editing ? "Save" : "Start practising") + '</button></div></div>';
}
function choiceHtml(kind, v, on) { return '<button class="choice" data-act="toggle" data-kind="' + kind + '" data-v="' + esc(v) + '" aria-pressed="' + on + '"><span class="box">✓</span><span>' + esc(v) + '</span></button>'; }

/* ---------- practice ---------- */
function stats(u) {
  var a = 0, c = 0, p = u.progress || {};
  Object.keys(p).forEach(function (k) { if (p[k].p !== undefined && p[k].p !== null) { a++; if (p[k].r) c++; } });
  return { a: a, c: c };
}
function topicsFor(subject) {
  var seen = {}, out = [];
  Q.forEach(function (d) { if (d.s === subject && !seen[d.t]) { seen[d.t] = 1; out.push(d.t); } });
  return out.sort();
}
function filtered(u) {
  var txt = ui.text.trim().toLowerCase(), prog = u.progress || {};
  return Q.filter(function (d) {
    if (ui.subject === "mine") { if (u.subjects.indexOf(d.s) < 0) return false; }
    else if (ui.subject !== "All" && d.s !== ui.subject) return false;
    if (ui.topic !== "All" && d.t !== ui.topic) return false;
    if (ui.fresh && prog[d.id] && (prog[d.id].p !== undefined || prog[d.id].s)) return false;
    if (txt && (d.q + " " + d.t + " " + d.o.join(" ")).toLowerCase().indexOf(txt) === -1) return false;
    return true;
  });
}
function cardHtml(d, u) {
  var pr = (u.progress || {})[d.id], picked = pr && pr.p !== undefined && pr.p !== null ? pr.p : undefined, shown = pr && pr.s, done = picked !== undefined || shown;
  var opts = d.o.map(function (o, k) {
    var cls = "opt"; if (done && k === d.a) cls += " right"; else if (picked === k) cls += " wrong";
    return '<button class="' + cls + '" data-act="pick" data-id="' + d.id + '" data-o="' + k + '"' + (done ? " disabled" : "") + '><b>' + LETTERS[k] + '</b><span>' + esc(o) + '</span></button>';
  }).join("");
  var res = picked !== undefined ? (picked === d.a ? '<span class="result ok">Correct</span>' : '<span class="result no">Not quite. The answer is ' + LETTERS[d.a] + '.</span>') : "";
  var act = done ? "" : '<button class="btn ghost sm" data-act="show" data-id="' + d.id + '">Show answer</button>';
  var exp = done ? '<div class="explain"><strong>Answer ' + LETTERS[d.a] + '.</strong> ' + esc(d.x) + '</div>' : "";
  return '<article class="card"><div class="meta"><span class="tag">' + esc(d.s) + '</span><span>·</span><span>' + esc(d.t) + '</span></div><p class="q">' + esc(d.q) + '</p><div class="opts">' + opts + '</div>' +
    (act || res ? '<div class="row">' + act + res + '</div>' : "") + exp + '</article>';
}
function appHtml() {
  var u = me(), st = stats(u);
  var chips = ["mine"].concat(SUBJECTS).map(function (s) { return '<button class="chip" data-act="subject" data-v="' + esc(s) + '" aria-pressed="' + (ui.subject === s) + '">' + (s === "mine" ? "My subjects" : esc(s)) + '</button>'; }).join("");
  var topicBox = "";
  if (ui.subject !== "mine" && ui.subject !== "All") {
    topicBox = '<div class="field"><label for="topic">Topic</label><select id="topic"><option value="All">All topics</option>' + topicsFor(ui.subject).map(function (t) { return '<option value="' + esc(t) + '"' + (t === ui.topic ? " selected" : "") + '>' + esc(t) + '</option>'; }).join("") + '</select></div>';
  }
  var head = '<div class="controls"><div class="hello"><h2>Hi, ' + esc(u.name.split(" ")[0]) + '</h2><p class="muted small">Preparing for ' + esc((u.prep || []).join(", ") || "your exams") + '</p></div>' +
    '<div class="stats"><span>Answered <b>' + st.a + '</b></span><span>Correct <b>' + st.c + '</b></span><span>Score <b>' + (st.a ? Math.round(st.c / st.a * 100) + "%" : "–") + '</b></span></div>' +
    '<input type="search" id="search" placeholder="Search, e.g. osmosis, force, pH" aria-label="Search questions" value="' + esc(ui.text) + '">' +
    '<div><div class="label" style="margin-bottom:6px">Subject</div><div class="chips">' + chips + '</div></div>' + topicBox +
    '<label class="check"><input type="checkbox" id="fresh"' + (ui.fresh ? " checked" : "") + '> Hide questions I have already done</label></div>';
  if (!Q.length) return head + '<p class="empty">' + (loadFailed ? "Could not load the questions. Please reload the page." : "Loading questions…") + '</p>';
  var rows = filtered(u);
  var body = rows.length ? '<div class="list">' + rows.slice(0, ui.limit).map(function (d) { return cardHtml(d, u); }).join("") + (rows.length > ui.limit ? '<button class="btn more" data-act="more">Show more (' + (rows.length - ui.limit) + ' left)</button>' : "") + '</div>' : '<p class="empty">No questions match. Try another subject, topic or search word.</p>';
  return head + '<p class="muted small" aria-live="polite">' + rows.length + (rows.length === 1 ? " question" : " questions") + '</p>' + body;
}

/* ---------- account ---------- */
function accountHtml() {
  var u = me(), st = stats(u), prog = u.progress || {}, per = {};
  Object.keys(prog).forEach(function (id) { var d = QBY[id]; if (!d || prog[id].p === undefined || prog[id].p === null) return; var o = per[d.s] || (per[d.s] = { a: 0, c: 0 }); o.a++; if (prog[id].r) o.c++; });
  var rows = (u.subjects || []).map(function (s) { var o = per[s] || { a: 0, c: 0 }; return '<tr><td>' + esc(s) + '</td><td>' + o.a + '</td><td>' + o.c + '</td><td>' + (o.a ? Math.round(o.c / o.a * 100) + "%" : "–") + '</td></tr>'; }).join("");
  var cf = ui.confirm;
  return '<div class="panel"><div class="hello"><h2>' + esc(u.name) + '</h2><p class="muted small">@' + esc(u.username) + '</p></div>' +
    '<div><div class="label">Preparing for</div><p>' + esc((u.prep || []).join(", ") || "Not set") + '</p></div>' +
    '<div class="scroll"><table><thead><tr><th>Subject</th><th>Answered</th><th>Correct</th><th>Score</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="muted small">Total answered ' + st.a + ', correct ' + st.c + '.</p>' +
    '<div class="row"><button class="btn" data-act="home">Back to practice</button><button class="btn ghost" data-act="editPlan">Change exams and subjects</button><button class="btn ghost" data-act="logout">Log out</button></div>' +
    '<div class="row">' + (cf === "reset" ? '<span>Erase all your answers?</span><button class="btn danger sm" data-act="doReset">Yes, erase</button><button class="btn ghost sm" data-act="cancelConfirm">Cancel</button>' : cf === "delete" ? '<span>Delete this account for good?</span><button class="btn danger sm" data-act="doDelete">Yes, delete</button><button class="btn ghost sm" data-act="cancelConfirm">Cancel</button>' : '<button class="btn ghost sm" data-act="confirm" data-v="reset">Reset progress</button><button class="btn ghost sm" data-act="confirm" data-v="delete">Delete account</button>') + '</div></div>';
}

/* ---------- events ---------- */
function toggle(arr, v) { var i = arr.indexOf(v); if (i > -1) arr.splice(i, 1); else arr.push(v); }
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, u = me();
  if (act === "mode") { ui.mode = b.dataset.v; render(); return; }
  if (act === "toggle") { var o = ui.ob; toggle(b.dataset.kind === "prep" ? o.prep : o.subjects, b.dataset.v); render(); return; }
  if (act === "obNext") { ui.ob.step = 2; render(); return; }
  if (act === "obBack") { ui.ob.step = 1; render(); return; }
  if (act === "cancelOb") { ui.ob = null; ui.view = "account"; render(); return; }
  if (act === "obDone") {
    u.prep = PREPS.filter(function (p) { return ui.ob.prep.indexOf(p) > -1; });
    u.subjects = SUBJECTS.filter(function (s) { return ui.ob.subjects.indexOf(s) > -1; });
    saveDb(); ui.ob = null; ui.view = "app"; ui.subject = "mine"; ui.topic = "All"; ui.limit = PAGE; render(); return;
  }
  if (act === "account") { ui.view = "account"; ui.confirm = null; render(); return; }
  if (act === "home") { ui.view = "app"; render(); return; }
  if (act === "editPlan") { ui.ob = { step: 1, prep: (u.prep || []).slice(), subjects: (u.subjects || []).slice(), editing: true }; ui.view = "onboard"; render(); return; }
  if (act === "logout") { db.current = null; saveDb(); ui.view = "auth"; ui.mode = "login"; ui.confirm = null; route(); return; }
  if (act === "confirm") { ui.confirm = b.dataset.v; render(); return; }
  if (act === "cancelConfirm") { ui.confirm = null; render(); return; }
  if (act === "doReset") { u.progress = {}; saveDb(); ui.confirm = null; render(); return; }
  if (act === "doDelete") { delete db.users[db.current]; db.current = null; saveDb(); ui.view = "auth"; ui.mode = "signup"; ui.confirm = null; route(); return; }
  if (act === "subject") { ui.subject = b.dataset.v; ui.topic = "All"; ui.limit = PAGE; render(); return; }
  if (act === "more") { ui.limit += PAGE; render(); return; }
  if (act === "pick") { u.progress = u.progress || {}; var d = QBY[b.dataset.id], k = Number(b.dataset.o); u.progress[d.id] = { p: k, r: k === d.a }; saveDb(); render(); return; }
  if (act === "show") { u.progress = u.progress || {}; var id = b.dataset.id; u.progress[id] = Object.assign({}, u.progress[id], { s: 1 }); saveDb(); render(); return; }
});
document.addEventListener("submit", function (ev) { if (ev.target.id === "authForm") { ev.preventDefault(); submitAuth(); } });
document.addEventListener("change", function (ev) {
  if (ev.target.id === "topic") { ui.topic = ev.target.value; ui.limit = PAGE; render(); }
  else if (ev.target.id === "fresh") { ui.fresh = ev.target.checked; ui.limit = PAGE; render(); }
});
document.addEventListener("input", function (ev) {
  if (ev.target.id === "search") {
    ui.text = ev.target.value; ui.limit = PAGE; var pos = ev.target.selectionStart; render();
    var s = $("search"); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} }
  }
});

loadDb();
route();
(window.QDATA ? Promise.resolve(window.QDATA) : fetch("questions.json").then(function (r) { return r.json(); })).then(function (d) {
  Q = d; d.forEach(function (x) { QBY[x.id] = x; }); render();
}).catch(function () { loadFailed = true; render(); });
</script>
</body>
</html>
